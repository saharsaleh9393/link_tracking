name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_local_only
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker_local_only@localhost:5432/tracker_test
        run: pytest -q
