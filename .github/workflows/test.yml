name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker_local_only
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker_local_only@localhost:5432/tracker_test
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Start isolated browser-test backend
        env:
          DATABASE_URL: postgresql+psycopg://tracker:tracker_local_only@127.0.0.1:5432/tracker_ui_test
          PUBLIC_BASE_URL: http://127.0.0.1:8003
          ADMIN_API_KEY: e2e-admin-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REPORT_API_KEY: e2e-report-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          VISITOR_HMAC_KEY: e2e-visitor-cccccccccccccccccccccccccccccccccccccccc
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://tracker:tracker_local_only@127.0.0.1:5432/postgres', autocommit=True) as connection:
              connection.execute('CREATE DATABASE tracker_ui_test')
          PY
          alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8003 --no-access-log --no-proxy-headers > /tmp/tracker-e2e.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=1) as r:
                      assert r.status == 200
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Browser-test backend did not become ready')
          PY
      - name: Browser workflows
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run test:e2e
