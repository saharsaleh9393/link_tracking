services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_local_only
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

# Local development database only. Production uses separately provisioned credentials.
volumes:
  postgres_data:
